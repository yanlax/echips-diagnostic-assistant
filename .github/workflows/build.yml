name: Build Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build
        run: cargo tauri build --no-bundle

      - name: Prepare portable exe
        shell: pwsh
        run: Copy-Item src-tauri/target/release/echips-diagnostic-app.exe "Echips-Hardware-Check.exe"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: echips-hardware-check-windows
          path: Echips-Hardware-Check.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Echips-Hardware-Check.exe
