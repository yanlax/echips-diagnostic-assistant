name: Build Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # Вспомогательный процесс датчиков (LibreHardwareMonitorLib) и установщик драйвера
      # PawnIO вшиваются в основной exe (include_bytes! через build.rs).
      - name: Build sensors helper
        shell: pwsh
        run: |
          dotnet publish helper/EchipsSensors/EchipsSensors.csproj -c Release -o helper/out
          New-Item -ItemType Directory -Force src-tauri/helper | Out-Null
          Compress-Archive -Path helper/out/* -DestinationPath src-tauri/helper/sensors.zip -Force
          Get-ChildItem helper/out | Select-Object Name, Length

      - name: Download PawnIO installer (pinned)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/namazso/PawnIO.Setup/releases/download/2.2.0/PawnIO_setup.exe -OutFile src-tauri/helper/PawnIO_setup.exe
          $h = (Get-FileHash src-tauri/helper/PawnIO_setup.exe -Algorithm SHA256).Hash.ToLower()
          if ($h -ne '1f519a22e47187f70a1379a48ca604981c4fcf694f4e65b734aaa74a9fba3032') { throw "PawnIO_setup.exe: неожиданная контрольная сумма $h" }

      - name: Build
        env:
          # Токен отправки отчётов (fine-grained, только репозиторий echips-reports,
          # Contents: write) — вшивается в exe, см. src-tauri/src/commands/upload.rs.
          ECHIPS_REPORTS_TOKEN: ${{ secrets.ECHIPS_REPORTS_TOKEN }}
        run: cargo tauri build --no-bundle

      - name: Prepare portable exe
        shell: pwsh
        run: Copy-Item src-tauri/target/release/echips-diagnostic-app.exe "Echips-Hardware-Check.exe"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: echips-hardware-check-windows
          path: Echips-Hardware-Check.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Echips-Hardware-Check.exe
