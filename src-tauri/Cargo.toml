[package]
name = "echips-diagnostic-app"
version = "0.9.0"
description = "Echips Hardware Check — диагностика, установка драйверов, замена платы"
authors = ["Echips"]
edition = "2021"

[lib]
name = "echips_diagnostic_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
# Скачивание пакетов драйверов с Yandex Disk и установка (портировано из
# echips-driver-assistant).
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
zip = "0.6"
futures-util = "0.3"
urlencoding = "2"
# Хэш-цепочка для аудит-лога замены платы.
sha2 = "0.10"
num_cpus = "1"
# PDF-экспорт отчёта (шрифт PT Sans в src-tauri/assets/fonts — кириллица,
# embedded_images — логотип в шапке, src-tauri/assets/logo.png).
printpdf = { version = "0.7", features = ["embedded_images"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"

# Статическая линковка CRT — без неё на чистом Windows не хватает VCRUNTIME.
[target.'cfg(target_os = "windows")'.dependencies]
