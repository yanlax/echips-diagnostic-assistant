<!-- ECHIPS — полный логотип (знак + название + плашка "Hardware Check")
     на тёмном фоне (#15171B) — как в шапке отчёта. Шрифт: Space Grotesk
     (при отсутствии на устройстве откатится на системный sans-serif). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 60" width="340" height="60">
  <rect width="340" height="60" rx="10" fill="#15171B"/>
  <polygon points="30,10 44,17 44,33 30,40 16,33 16,17" fill="none" stroke="#FF8A00" stroke-width="3.6" stroke-linecap="round"/>
  <text x="56" y="30" font-family="'Space Grotesk',Arial,sans-serif" font-weight="700" font-size="17" letter-spacing="1" fill="#F2F3F5">ECHIPS</text>
  <rect x="56" y="38" width="118" height="16" rx="8" fill="none" stroke="#FFB259" stroke-opacity=".5" stroke-width="1"/>
  <text x="65" y="49" font-family="Arial,sans-serif" font-weight="600" font-size="8.5" letter-spacing="1.2" fill="#FFB259">HARDWARE CHECK</text>
</svg>
