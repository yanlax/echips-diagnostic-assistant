<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Echips Hardware Check</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <header class="titlebar">
    <div class="t">ECHIPS HARDWARE CHECK</div>
    <button class="winbtn theme" type="button" id="theme-toggle" title="Сменить тему" aria-label="Сменить тему" onclick="EchipsTheme.toggle()">
      <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path></svg>
      <svg class="icon-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"></path></svg>
    </button>
    <button class="winbtn" type="button" id="win-minimize" title="Свернуть" aria-label="Свернуть">
      <svg viewBox="0 0 10 10"><line x1="1" y1="5" x2="9" y2="5"></line></svg>
    </button>
    <button class="winbtn" type="button" id="win-maximize" title="Развернуть / восстановить (двойной клик по заголовку)" aria-label="Развернуть или восстановить">
      <svg viewBox="0 0 10 10"><rect x="1.5" y="1.5" width="7" height="7" fill="none"></rect></svg>
    </button>
    <button class="winbtn close" type="button" id="win-close" title="Закрыть" aria-label="Закрыть">
      <svg viewBox="0 0 10 10"><line x1="1" y1="1" x2="9" y2="9"></line><line x1="9" y1="1" x2="1" y2="9"></line></svg>
    </button>
  </header>

  <div class="main">
    <aside class="sidebar">
      <div class="brand">
        <div class="mark logo"><img src="logo.png" alt="Echips"></div>
        <div>
          <div class="h">Echips Hardware<br>Check</div>
          <div class="s">v0.9.0 · ОТК / сервис</div>
        </div>
      </div>

      <nav class="steps" id="steps"></nav>

      <div class="devbox" id="devbox">
        <div class="k">Устройство</div>
        <div class="n" id="devbox-name">определяется…</div>
        <div class="sn" id="devbox-sn"></div>
      </div>

      <div class="sidefoot">
        <span class="c">© Echips</span>
        <a href="#" id="site-link">echips.ru</a>
      </div>
    </aside>

    <div class="content" id="screen"></div>
  </div>
</div>

<script src="theme.js"></script>
<script src="profiles.js"></script>
<script src="app.js"></script>
</body>
</html>
